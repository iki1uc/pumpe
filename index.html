/* ---- Anker Geo Cylinder ---- */
.cylinder-shell {
  background:
    linear-gradient(180deg, rgba(240, 208, 128, 0.14), rgba(240, 208, 128, 0) 18%),
    linear-gradient(90deg, #0a1826 0%, #17334a 22%, #2a5878 50%, #17334a 78%, #081220 100%);
  box-shadow:
    inset 0 0 0 1px rgba(240, 208, 128, 0.35),
    inset 0 -28px 44px rgba(0, 0, 0, 0.55),
    inset 0 22px 34px rgba(255, 255, 255, 0.08),
    0 24px 60px rgba(0, 0, 0, 0.55);
}
.cylinder-lid {
  background: radial-gradient(ellipse at 50% 42%, #d9ecf5 0%, #7fa6bd 34%, #33566f 68%, #101f2e 100%);
  box-shadow: inset 0 0 0 1px rgba(240, 208, 128, 0.5), inset 0 -10px 18px rgba(0, 0, 0, 0.5);
}
.chamber {
  background: linear-gradient(160deg, rgba(16, 56, 34, 0.9), rgba(5, 16, 12, 0.95));
  box-shadow: inset 0 0 0 1px rgba(46, 168, 106, 0.35), inset 0 6px 10px rgba(0, 0, 0, 0.6);
  transition: background 240ms ease, box-shadow 240ms ease, transform 240ms ease;
}
.chamber-lit {
  background: linear-gradient(160deg, rgba(240, 208, 128, 0.95), rgba(146, 96, 20, 0.9));
  box-shadow:
    inset 0 0 0 1px rgba(255, 240, 190, 0.9),
    0 0 14px rgba(240, 208, 128, 0.55);
  transform: translateY(-1px);
}
.chamber-hot {
  background: linear-gradient(160deg, rgba(255, 77, 77, 0.95), rgba(138, 26, 26, 0.95)) !important;
  box-shadow: inset 0 0 0 1px rgba(255, 190, 190, 0.9), 0 0 16px rgba(255, 77, 77, 0.6) !important;
}
.fields-64 {
  background-image: radial-gradient(circle, rgba(233, 242, 228, 0.85) 1px, transparent 1.4px);
  background-size: 5px 5px;
  background-position: 1px 1px;
  opacity: 0.5;
}
@keyframes rotorSweep {
  0% {
    transform: rotate(0deg);
  }
  100% {
    transform: rotate(360deg);
  }
}
.rotor {
  animation: rotorSweep 9s linear infinite;
  transform-origin: 50% 50%;
}
@keyframes pumpPulse {
  0%, 100% {
    opacity: 0.35;
  }
  50% {
    opacity: 1;
  }
}
.pump-pulse {
  animation: pumpPulse 1.1s ease-in-out infinite;
}
@keyframes blobFloat {
  0%, 100% {
    transform: translateY(0) scale(1);
  }
  50% {
    transform: translateY(-6px) scale(1.03);
  }
}
.blob-float {
  animation: blobFloat 3.2s ease-in-out infinite;
}
.neon-text {
  text-shadow: 0 0 12px rgba(57, 213, 232, 0.65), 0 0 34px rgba(57, 213, 232, 0.3);
}
textarea, input, select, button {
  font-family: inherit;

  background: rgba(240, 208, 128, 0.4);
