<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌌 PLANETRISCHER ORGANISMUS · 3→9→27→81→243→729→3</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: radial-gradient(ellipse at 30% 20%, #0a0e1a, #000000);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', 'Consolas', monospace;
      padding: 10px;
      color: #c0d0d0;
      overflow: hidden;
    }

    .container {
      max-width: 1200px;
      width: 100%;
      background: rgba(6, 8, 16, 0.6);
      backdrop-filter: blur(4px);
      border-radius: 40px;
      padding: 20px 24px 30px;
      border: 1px solid rgba(160, 200, 240, 0.05);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9), inset 0 0 80px rgba(100, 180, 255, 0.02);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      border-bottom: 1px solid rgba(160, 200, 240, 0.04);
      padding-bottom: 6px;
      margin-bottom: 12px;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 300;
      letter-spacing: 4px;
      background: linear-gradient(135deg, #e0e8f0, #b0c8d8, #8098b0, #c0d8e8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header h1 small {
      font-size: 11px;
      letter-spacing: 2px;
      -webkit-text-fill-color: #4a5a6a;
      color: #4a5a6a;
    }

    .status {
      display: flex;
      gap: 24px;
      font-size: 12px;
      color: #5a7a8a;
      letter-spacing: 1px;
    }
    .status span {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #2a4a5a;
      transition: 0.3s;
    }
    .dot.pulse {
      background: #8cf0d0;
      box-shadow: 0 0 16px #8cf0d0;
      animation: pulse 1.4s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    .canvas-wrap {
      position: relative;
      margin: 8px 0 16px;
      border-radius: 28px;
      background: rgba(2, 4, 10, 0.8);
      border: 1px solid rgba(80, 140, 200, 0.03);
      box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.8);
      aspect-ratio: 1 / 1;
      width: 100%;
      max-height: 70vh;
      overflow: hidden;
      touch-action: none;
    }
    #orbitCanvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .info-panel {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-top: 1px solid rgba(160, 200, 240, 0.02);
      margin-top: 4px;
      font-size: 12px;
      color: #5a7a8a;
    }
    .info-panel .val {
      color: #b0d0e0;
      font-weight: 400;
    }
    .info-panel .highlight {
      color: #f0d080;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      margin: 6px 0 4px;
    }
    .controls button {
      background: rgba(20, 28, 36, 0.4);
      border: 1px solid rgba(120, 160, 190, 0.06);
      color: #9ab0c0;
      padding: 5px 16px;
      border-radius: 30px;
      font-size: 11px;
      font-family: inherit;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s;
      backdrop-filter: blur(2px);
    }
    .controls button:hover {
      background: rgba(40, 70, 90, 0.25);
      border-color: rgba(160, 200, 240, 0.15);
      color: #d0e8f8;
      transform: translateY(-1px);
    }
    .controls button.primary {
      border-color: rgba(180, 220, 255, 0.08);
      color: #b0d0e0;
    }
    .controls button.primary:hover {
      background: rgba(60, 140, 200, 0.08);
      border-color: #80c0e0;
    }
    .controls button.ds9 {
      border-color: rgba(255, 215, 0, 0.06);
      color: #e0c880;
    }
    .controls button.ds9:hover {
      background: rgba(255, 215, 0, 0.05);
    }
    .controls button.danger {
      border-color: rgba(255, 80, 80, 0.06);
      color: #d06060;
    }
    .controls button.danger:hover {
      background: rgba(255, 80, 80, 0.04);
    }

    .log {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 14px;
      padding: 4px 14px;
      font-size: 9px;
      color: #3a5a6a;
      max-height: 50px;
      overflow-y: auto;
      border: 1px solid rgba(100, 140, 170, 0.01);
      margin-top: 6px;
      line-height: 1.6;
      font-family: 'Consolas', monospace;
    }
    .log .ok { color: #80d0b0; }
    .log .flow { color: #d0b080; }
    .log .ds9 { color: #e8d080; }
    .log .phase { color: #70c8ff; }

    .footer {
      text-align: center;
      margin-top: 10px;
      color: #1a2a30;
      font-size: 8px;
      letter-spacing: 3px;
    }
    .footer .gold { color: #e8d080; }
    .footer .silver { color: #b0c8d8; }

    @media (max-width: 700px) {
      .container { padding: 12px; }
      .header h1 { font-size: 18px; letter-spacing: 2px; }
      .controls button { font-size: 9px; padding: 4px 10px; }
      .status { font-size: 10px; gap: 12px; }
      .info-panel { font-size: 10px; }
    }
  </style>
</head>
<body>

<div class="container">

  <div class="header">
    <h1>🌌 PLANETRISCHER ORGANISMUS <small>3 → 9 → 27 → 81 → 243 → 729 → 3</small></h1>
    <div class="status">
      <span><span class="dot pulse" id="dotPhase"></span> LEBENDIG</span>
      <span id="phaseLabel">PHASE 3</span>
    </div>
  </div>

  <div class="canvas-wrap">
    <canvas id="orbitCanvas"></canvas>
  </div>

  <div class="info-panel">
    <span>AKTUELLE DIMENSION: <span class="val highlight" id="currentDim">3</span></span>
    <span>ZYKLUS: <span class="val" id="cycleCount">0</span></span>
    <span>RINGE: <span class="val">6</span></span>
    <span>PARTIKEL: <span class="val" id="particleCount">0</span></span>
  </div>

  <div class="controls">
    <button class="primary" id="btnToggle">⏸ PAUSE</button>
    <button class="primary" id="btnSpeed">⏩ TEMPO</button>
    <button class="ds9" id="btnDs9">★ DS9</button>
    <button id="btnReset">⟲ RESET</button>
  </div>

  <div class="log" id="log">
    [🌌] Organismus erwacht · 3→9→27→81→243→729→3 · ewiger Kreislauf
  </div>

  <div class="footer">
    <span class="gold">★</span> QUECKSILBER · PLANETRISCHE WIRKLICHKEIT · <span class="silver">universelle Bewegung</span>
  </div>
</div>

<script>
  // ================================================================
  //  PLANETRISCHER ORGANISMUS – 3→9→27→81→243→729→3
  //  Echtes Sonnensystem mit pulsierenden Ringen
  // ================================================================

  const canvas = document.getElementById('orbitCanvas');
  const ctx = canvas.getContext('2d');

  let W = 0, H = 0, DPR = 1;

  function resize() {
    const rect = canvas.parentElement.getBoundingClientRect();
    W = rect.width;
    H = rect.height;
    DPR = window.devicePixelRatio || 1;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);

  // ─── ZAHLEN UND RINGE ───────────────────────────────────────────
  const DIMENSIONS = [3, 9, 27, 81, 243, 729];
  const NUM_RINGS = DIMENSIONS.length;
  const MAX_PARTICLES_PER_RING = 300; // für große Dimensionen begrenzt

  // ─── ZUSTAND ──────────────────────────────────────────────────
  let state = {
    paused: false,
    speed: 1.0,
    ds9: false,
    cycle: 0,
    time: 0,          // sekunden seit start
    phaseIndex: 0,    // 0..5
    phaseProgress: 0, // 0..1 innerhalb einer Phase (Expansion)
    rings: []
  };

  // ─── RING-KLASSE ──────────────────────────────────────────────
  class Ring {
    constructor(dim, index) {
      this.dim = dim;
      this.index = index;
      this.baseRadius = 0; // wird nach resize berechnet
      this.particles = [];
      this.angleOffset = Math.random() * Math.PI * 2;
      this.angularSpeed = 0.3 / (1 + index * 0.15); // äußere langsamer
      // Partikel initialisieren
      const count = Math.min(dim, MAX_PARTICLES_PER_RING);
      for (let i = 0; i < count; i++) {
        const phi = (i / count) * Math.PI * 2 + this.angleOffset;
        this.particles.push({ phi });
      }
      // für dim > max, speichere die tatsächliche Anzahl, zeichne aber nur max
      this.totalCount = dim;
      this.displayCount = count;
    }

    updateRadius(scaleFactor, centerX, centerY, maxRadius) {
      // Radius = sqrt(dim) * skaliert, damit 3 und 729 gut sichtbar
      const raw = Math.sqrt(this.dim) * 18 + 20;
      // Skalierung durch den globalen Faktor (Puls)
      this.currentRadius = raw * scaleFactor * 0.8 + 12;
      // Begrenzung auf maxRadius
      if (this.currentRadius > maxRadius * 0.85) this.currentRadius = maxRadius * 0.85;
      this.centerX = centerX;
      this.centerY = centerY;
    }

    draw(ctx, time, dimScale) {
      const r = this.currentRadius;
      if (r < 2) return;

      // Farbe je nach Dimension
      const hue = 200 + this.index * 25;
      const lightness = 50 + 20 * (this.index / NUM_RINGS);
      const alpha = 0.7 + 0.3 * (this.index / NUM_RINGS);

      // Ring-Linie (schwach)
      ctx.beginPath();
      ctx.arc(this.centerX, this.centerY, r, 0, Math.PI * 2);
      ctx.strokeStyle = `hsla(${hue}, 70%, ${lightness}%, ${alpha * 0.2})`;
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Partikel zeichnen
      const count = this.displayCount;
      const total = this.totalCount;
      const angleBase = time * this.angularSpeed + this.angleOffset;

      // Wenn DS9 aktiv, goldener Schimmer
      const glow = state.ds9 ? 'rgba(255,215,0,0.2)' : 'transparent';

      for (let i = 0; i < count; i++) {
        const phi = this.particles[i].phi + angleBase;
        const x = this.centerX + Math.cos(phi) * r;
        const y = this.centerY + Math.sin(phi) * r;

        const size = 2 + 2 * (this.dim / 729) * 0.5;
        // Größe variieren
        ctx.beginPath();
        ctx.arc(x, y, size, 0, Math.PI * 2);
        const col = `hsl(${hue + 20 * Math.sin(phi)}, 80%, ${60 + 20 * Math.sin(phi * 2)}%)`;
        ctx.fillStyle = col;
        ctx.fill();
        if (state.ds9) {
          ctx.shadowColor = '#ffd700';
          ctx.shadowBlur = 12;
          ctx.fill();
          ctx.shadowBlur = 0;
        }
      }

      // Label mit der Zahl
      ctx.font = `${12 + this.dim / 100}px monospace`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = `hsla(${hue}, 70%, 80%, 0.5)`;
      ctx.fillText(this.dim, this.centerX + r + 20, this.centerY - 6);

      // Wenn dim > 100, kleine Anzahl anzeigen
      if (this.totalCount > MAX_PARTICLES_PER_RING) {
        ctx.font = '8px monospace';
        ctx.fillStyle = 'rgba(200,220,240,0.2)';
        ctx.fillText(`+${this.totalCount - this.displayCount}`, this.centerX + r + 20, this.centerY + 16);
      }
    }
  }

  // ─── INIT RINGS ──────────────────────────────────────────────
  let rings = [];

  function initRings() {
    rings = DIMENSIONS.map((dim, idx) => new Ring(dim, idx));
    state.rings = rings;
  }
  initRings();

  // ─── SKALIERUNG UND PHASE ─────────────────────────────────────
  function getScaleAndPhase(time) {
    // Ein Zyklus dauert 20 Sekunden (bei speed=1)
    const cycleDuration = 20 / state.speed;
    const t = time % cycleDuration;
    const progress = t / cycleDuration; // 0..1

    // Phase: 0..6 (0=3, 1=9, ..., 5=729, 6=zurück zu 3)
    const phaseCount = NUM_RINGS * 2; // hin und zurück
    const rawPhase = progress * phaseCount;
    let phaseIndex = Math.floor(rawPhase);
    let subProgress = rawPhase - phaseIndex;

    // Wenn phaseIndex >= NUM_RINGS, dann schrumpfen wir
    let expand = true;
    if (phaseIndex >= NUM_RINGS) {
      expand = false;
      phaseIndex = phaseCount - 1 - phaseIndex;
      if (phaseIndex < 0) phaseIndex = 0;
    }
    if (phaseIndex >= NUM_RINGS) phaseIndex = NUM_RINGS - 1;

    const dim = DIMENSIONS[phaseIndex];
    // Skalierungsfaktor: bei expand von 0.3 -> 1.0, bei shrink von 1.0 -> 0.3
    let scale;
    if (expand) {
      scale = 0.3 + 0.7 * subProgress;
    } else {
      scale = 1.0 - 0.7 * subProgress;
    }
    // Sicherstellen, dass scale zwischen 0.25 und 1.0 liegt
    scale = Math.min(1.0, Math.max(0.25, scale));

    return { dim, scale, phaseIndex, subProgress, expand };
  }

  // ─── RENDER ──────────────────────────────────────────────────
  function render(time) {
    const centerX = W / 2;
    const centerY = H / 2;
    const maxRadius = Math.min(W, H) * 0.42;

    // Phasenberechnung
    const { dim, scale, phaseIndex, subProgress, expand } = getScaleAndPhase(time);
    state.phaseIndex = phaseIndex;
    state.phaseProgress = subProgress;
    state.currentDim = dim;

    // Hintergrund
    ctx.clearRect(0, 0, W, H);

    // Leichter Nebel
    const grad = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, maxRadius);
    grad.addColorStop(0, 'rgba(10, 20, 40, 0)');
    grad.addColorStop(1, 'rgba(0, 0, 0, 0.8)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Zentraler Stern
    const starR = 10 + 6 * (1 + Math.sin(time * 0.5) * 0.2);
    const starGrad = ctx.createRadialGradient(centerX - 4, centerY - 4, 2, centerX, centerY, starR * 1.8);
    starGrad.addColorStop(0, '#fffbe6');
    starGrad.addColorStop(0.4, '#ffd080');
    starGrad.addColorStop(1, 'rgba(255,180,50,0)');
    ctx.fillStyle = starGrad;
    ctx.beginPath();
    ctx.arc(centerX, centerY, starR * 1.8, 0, Math.PI * 2);
    ctx.fill();

    ctx.shadowColor = '#ffd080';
    ctx.shadowBlur = 30;
    ctx.fillStyle = '#ffe080';
    ctx.beginPath();
    ctx.arc(centerX, centerY, starR * 0.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Ringe aktualisieren und zeichnen
    const totalParticles = rings.reduce((sum, r) => sum + r.displayCount, 0);
    document.getElementById('particleCount').textContent = totalParticles;

    for (let i = 0; i < rings.length; i++) {
      const ring = rings[i];
      ring.updateRadius(scale, centerX, centerY, maxRadius);
      ring.draw(ctx, time, scale);
    }

    // DS9-Effekt (goldener Schleier)
    if (state.ds9) {
      ctx.fillStyle = 'rgba(255, 215, 0, 0.02)';
      ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = 'rgba(255, 215, 0, 0.03)';
      ctx.lineWidth = 1;
      for (let i = 0; i < 6; i++) {
        const r = maxRadius * (0.2 + i * 0.15);
        ctx.beginPath();
        ctx.arc(centerX, centerY, r, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    // Info einblenden
    ctx.fillStyle = 'rgba(200,220,240,0.25)';
    ctx.font = '11px monospace';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'bottom';
    ctx.fillText(`Phase: ${dim}  ·  Zyklus: ${Math.floor(time / (20/state.speed))}`, 16, H - 10);

    // Aktuelle Dimension prominent
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.font = `bold ${20 + dim/20}px monospace`;
    ctx.fillStyle = `hsla(${200 + phaseIndex * 30}, 80%, 70%, 0.4)`;
    ctx.fillText(dim, centerX, 12);

    // Fortschrittsbalken (Puls)
    const barWidth = Math.min(W * 0.3, 180);
    const barX = W/2 - barWidth/2;
    const barY = H - 20;
    ctx.fillStyle = 'rgba(200,220,240,0.05)';
    ctx.fillRect(barX, barY, barWidth, 4);
    ctx.fillStyle = `hsla(${200 + phaseIndex * 30}, 80%, 70%, 0.5)`;
    const fill = expand ? subProgress : 1 - subProgress;
    ctx.fillRect(barX, barY, barWidth * fill, 4);
  }

  // ─── ANIMATIONSLOOP ──────────────────────────────────────────
  let lastTimestamp = 0;
  let elapsedTime = 0;

  function animate(timestamp) {
    if (!lastTimestamp) lastTimestamp = timestamp;
    const delta = (timestamp - lastTimestamp) / 1000;
    lastTimestamp = timestamp;

    if (!state.paused) {
      elapsedTime += delta * state.speed;
    }

    render(elapsedTime);

    // UI aktualisieren
    const { dim, scale, phaseIndex } = getScaleAndPhase(elapsedTime);
    document.getElementById('currentDim').textContent = dim;
    document.getElementById('cycleCount').textContent = Math.floor(elapsedTime / (20 / state.speed));
    document.getElementById('phaseLabel').textContent = `PHASE ${dim}`;

    requestAnimationFrame(animate);
  }

  // ─── RESIZE ──────────────────────────────────────────────────
  resize();

  // ─── INTERAKTION ──────────────────────────────────────────────
  document.getElementById('btnToggle').addEventListener('click', () => {
    state.paused = !state.paused;
    document.getElementById('btnToggle').textContent = state.paused ? '▶ START' : '⏸ PAUSE';
    log(state.paused ? '⏸ Pause' : '▶ Weiter', 'flow');
  });

  document.getElementById('btnSpeed').addEventListener('click', () => {
    state.speed = state.speed === 1.0 ? 2.5 : state.speed === 2.5 ? 0.5 : 1.0;
    document.getElementById('btnSpeed').textContent = `⏩ ${state.speed}x`;
    log(`⏩ Tempo: ${state.speed}x`, 'flow');
  });

  document.getElementById('btnDs9').addEventListener('click', () => {
    state.ds9 = !state.ds9;
    log(state.ds9 ? '★ DS9 aktiv – goldener Schimmer' : '★ DS9 inaktiv', 'ds9');
  });

  document.getElementById('btnReset').addEventListener('click', () => {
    elapsedTime = 0;
    state.cycle = 0;
    log('⟲ Organismus zurückgesetzt', 'flow');
  });

  // ─── TASTATUR ──────────────────────────────────────────────────
  document.addEventListener('keydown', (e) => {
    if (e.key === ' ') { e.preventDefault(); document.getElementById('btnToggle').click(); }
    if (e.key === 's' || e.key === 'S') document.getElementById('btnSpeed').click();
    if (e.key === 'd' || e.key === 'D') document.getElementById('btnDs9').click();
    if (e.key === 'x' || e.key === 'X') document.getElementById('btnReset').click();
  });

  // ─── LOG ──────────────────────────────────────────────────────
  function log(msg, type = 'ok') {
    const el = document.getElementById('log');
    const time = new Date().toLocaleTimeString();
    const cls = ['ok', 'flow', 'ds9', 'phase'].includes(type) ? type : 'ok';
    el.innerHTML += `<div>[${time}] <span class="${cls}">${msg}</span></div>`;
    el.scrollTop = el.scrollHeight;
    if (el.children.length > 20) el.removeChild(el.firstChild);
  }

  log('🌌 3→9→27→81→243→729→3 · ewiger Atem', 'ds9');
  log('⌨️  Leertaste=Pause  s=Tempo  d=DS9  x=Reset', 'flow');

  // ─── START ────────────────────────────────────────────────────
  requestAnimationFrame(animate);
</script>
</body>
</html>
